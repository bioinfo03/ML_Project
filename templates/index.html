<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Hydrophobicity Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f7fb;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0 18px;
            box-sizing: border-box;
        }
        button {
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        label { font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>Protein Hydrophobicity Analyzer</h1>

{% if error %}
<p style="color: red;"><strong>Error:</strong> {{ error }}</p>
{% endif %}

    <p>Enter a protein accession number or paste a protein sequence.</p>

    <form action="/analyze" method="POST">
        <label for="accession">NCBI Protein Accession</label>
        <input type="text" id="accession" name="accession"
               placeholder="Example: Q26473">

        <label for="sequence">Or paste a protein sequence</label>
        <textarea id="sequence" name="sequence" rows="6"
                  placeholder="Example: MRAALVAVA..."></textarea>

        <label for="window_size">Window size</label>
        <input type="number" id="window_size" name="window_size"
               value="19" min="1" required>

        <label for="threshold">Hydrophobicity threshold</label>
        <input type="number" id="threshold" name="threshold"
               value="1.6" step="0.1" required>

        <button type="submit">Analyze Protein</button>
    </form>
</div>
</body>
</html>
